name: Собрать APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Robinzon.apk
      - uses: actions/upload-artifact@v4
        with: { name: Robinzon-apk, path: Robinzon.apk }
      - name: Опубликовать APK по постоянной ссылке
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Робинзон — последняя версия
          body: "Скачать: Robinzon.apk ниже. Собрано автоматически."
          files: Robinzon.apk
          make_latest: true
